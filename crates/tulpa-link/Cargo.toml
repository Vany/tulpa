[package]
name = "tulpa-link"
description = "Outbound SSH channels for the remote agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
flume = { version = "0.12.0", default-features = false }
mdns-sd = { version = "0.21.7", default-features = false }
rpassword = "7.5.5"
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa"], git = "https://github.com/warp-tech/russh.git", rev = "b541663a88381aab9f6af1af7bbadb02e155058a" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "process"] }
toml = "1.2.1"
tulpa-secrets = { version = "0.1.0", path = "../tulpa-secrets" }
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3"
