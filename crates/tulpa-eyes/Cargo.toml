[package]
name = "tulpa-eyes"
description = "Permission-bound display and camera capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The photo store's private directory and file (openat, O_EXCL, O_NOFOLLOW, fchmod); already in Cargo.lock.
rustix = { version = "1.1.6", features = ["fs", "std"] }
# The photo's sha256 in the reply; already in Cargo.lock.
sha2 = { version = "0.11.0", default-features = false }

[dev-dependencies]
tempfile = "3"
