[graph]
all-features = true

[advisories]
db-path = "target/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # RUSTSEC-2024-0370: proc-macro-error is unmaintained. It is build-time
    # only, pulled by glib-macros in the gtk-rs 0.18 stack that backs
    # tray-icon/muda/tao on Linux. No safe upgrade exists upstream; gtk-rs
    # 0.18 has not moved off it. Flagged for the security review: revisit
    # when gtk-rs releases a macro stack without proc-macro-error.
    "RUSTSEC-2024-0370",
]

[licenses]
# MPL-2.0 (dirs-sys via tray-icon) and Apache-2.0 WITH LLVM-exception
# (cfg-expr via system-deps) enter through the cross-platform trees of the
# macOS-only GUI stack; both are weak-copyleft/permissive build or utility
# crates, not linked into the shipped macOS binary.
# Unlicense (public-domain dedication): whisper-rs and whisper-rs-sys, the in-process recognizer behind tulpa-hear's
# optional `whisper` feature.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-3.0", "MPL-2.0", "Apache-2.0 WITH LLVM-exception", "Unlicense"]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
    { crate = "getrandom:0.2.17", reason = "ring 0.17 uses this version alongside the current RustCrypto stack" },
    { crate = "syn:2.0.119", reason = "russh transitive macros span syn 2 and 3" },
    { crate = "windows-sys:0.52.0", reason = "ring 0.17 uses this version alongside tokio" },
    # The macOS-only GUI stack (tray-icon/muda/tao) resolves its Windows and
    # Linux counterparts into the lock, and cargo-deny checks every target.
    # Each older version below is locked by that cross-platform tree, never
    # built into the macOS binary. Revisit on tray-icon/muda/tao upgrades.
    { crate = "heck:0.4.1", reason = "glib-macros in gtk-rs 0.18 pins heck 0.4 alongside heck 0.5" },
    { crate = "miniz_oxide:0.8.9", reason = "png 0.18 via muda pins miniz_oxide 0.8 alongside 0.9" },
    { crate = "proc-macro-crate:1.3.1", reason = "gtk3-macros pins proc-macro-crate 1 alongside 3" },
    { crate = "proc-macro-crate:2.0.2", reason = "toml_edit 0.20 pins proc-macro-crate 2 alongside 3" },
    { crate = "serde_spanned:0.6.9", reason = "toml 0.8 build tree of gtk-sys pins serde_spanned 0.6 alongside 1" },
    { crate = "syn:1.0.109", reason = "proc-macro-error via glib-macros pins syn 1 alongside 2 and 3" },
    { crate = "thiserror:1.0.69", reason = "gtk-rs 0.18 pins thiserror 1 alongside 2" },
    { crate = "thiserror-impl:1.0.69", reason = "thiserror 1 companion" },
    { crate = "toml:0.8.2", reason = "system-deps build dependency of gtk-sys pins toml 0.8 alongside 1" },
    { crate = "toml_datetime:0.6.3", reason = "toml 0.8 build tree pins toml_datetime 0.6 alongside 1" },
    { crate = "toml_edit:0.19.15", reason = "toml 0.8 build tree pins toml_edit 0.19 alongside 0.25" },
    { crate = "toml_edit:0.20.2", reason = "proc-macro-crate 2 pins toml_edit 0.20 alongside 0.25" },
    { crate = "winnow:0.5.40", reason = "toml_edit 0.19 pins winnow 0.5 alongside 1" },
    { crate = "windows-sys:0.45.0", reason = "jni via tao pins windows-sys 0.45 alongside 0.52 and 0.61" },
    { crate = "jni:0.21.1", reason = "tao pins jni 0.21 alongside jni 0.22 from cpal's Android backend (tulpa-hear); neither is built on macOS" },
    { crate = "jni-sys:0.3.1", reason = "tao (via jni 0.21) pins jni-sys 0.3 alongside 0.4 from cpal's Android backend (tulpa-hear); neither is built on macOS" },
    { crate = "windows-targets:0.42.2", reason = "windows-sys 0.45 pins windows-targets 0.42 alongside 0.52" },
    { crate = "windows_aarch64_gnullvm:0.42.2", reason = "windows-targets 0.42 companion" },
    { crate = "windows_aarch64_msvc:0.42.2", reason = "windows-targets 0.42 companion" },
    { crate = "windows_i686_gnu:0.42.2", reason = "windows-targets 0.42 companion" },
    { crate = "windows_i686_msvc:0.42.2", reason = "windows-targets 0.42 companion" },
    { crate = "windows_x86_64_gnu:0.42.2", reason = "windows-targets 0.42 companion" },
    { crate = "windows_x86_64_gnullvm:0.42.2", reason = "windows-targets 0.42 companion" },
    { crate = "windows_x86_64_msvc:0.42.2", reason = "windows-targets 0.42 companion" },
    { crate = "libloading:0.7.4", reason = "libappindicator-sys (tray-icon's Linux tree) pins libloading 0.7 alongside 0.8 from clang-sys, a build dependency of whisper-rs-sys (tulpa-hear's optional `whisper`)" },
    { crate = "shlex:1.3.0", reason = "bindgen, a build dependency of whisper-rs-sys (tulpa-hear's optional `whisper`), pins shlex 1 alongside 2 from cc" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Temporary upstream pin for ssh-key rc.12 and patched rsa 0.10.
allow-git = ["https://github.com/warp-tech/russh.git"]
